# Tracked catalog metadata. The render step builds catalog/ from this file,
# columns.yaml, codes.yaml, builds/v*.json and templates/.
#
# Edit these files, then run `pixi run python -m rgi_catalog render --version 7.0`.
# tests/unit/test_render.py fails when catalog/ differs from a fresh render.

id: rgi
title: Randolph Glacier Inventory Mirror

public_base: https://data.source.coop/lqgentner/rgi
# The anonymous regional bucket behind public_base, for the alternate s3 hrefs.
# The region is the one Source Cooperative shows for the product.
public_s3_base: s3://us-west-2.opendata.source.coop/lqgentner/rgi
# The hosting page on Source Cooperative.
about: https://source.coop/lqgentner/rgi
repository: https://github.com/lqgentner/rgi-catalog
# The Portolan browser route. The published JSON URL without its scheme follows it.
browser: https://browser.portolan-sdi.org/#/external/

license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/

doi: 10.5067/f6jmovy5navz
# The citations are in APA 7 style, in Markdown. The STAC sci fields carry them
# without the asterisks.
citation: >-
  RGI 7.0 Consortium. (2023). *Randolph Glacier Inventory: A dataset of global
  glacier outlines* (Version 7.0) [Data set]. NSIDC: National Snow and Ice Data
  Center. https://doi.org/10.5067/F6JMOVY5NAVZ

# The authoritative distribution.
via:
  href: https://nsidc.org/data/nsidc-0770/versions/7
  title: RGI 7.0 at NSIDC (authoritative source)
nsidc_files: https://daacdata.apps.nsidc.org/pub/DATASETS/nsidc0770_rgi_v7/global_files

user_guide: https://rgidata.org/user_guide/

publications:
  - doi: 10.5281/zenodo.8362857
    citation: >-
      Maussion, F., Hock, R., Paul, F., Raup, B., Rastner, P., Zemp, M.,
      Andreassen, L., Barr, I., Bolch, T., Kochtitzky, W., McNabb, R., &
      Tielidze, L. (2023). *The Randolph Glacier Inventory version 7.0 user
      guide*. Zenodo. https://doi.org/10.5281/zenodo.8362857

providers:
  - name: RGI Consortium
    description: >-
      Produces the Randolph Glacier Inventory, a globally complete inventory
      of glacier outlines.
    roles: [producer, licensor]
    url: https://rgidata.org
  - name: Luis Q. Gentner
    description: >-
      Hosts this unofficial mirror. Converts the RGI files to cloud-native
      formats and maintains this catalog.
    roles: [host]
    url: https://orcid.org/0009-0006-4453-0881

keywords: [glaciers, glacier outlines, glacier inventory, cryosphere, RGI, GLIMS]

# The paragraph after the text of every README and description. The citation
# follows it as a block quote.
disclaimer: >-
  This is an unofficial mirror, not endorsed by the RGI Consortium. The
  authoritative source is [RGI 7.0 at NSIDC](https://nsidc.org/data/nsidc-0770/versions/7).
  Citation and credit belong to the RGI Consortium:

issue_tracker: https://github.com/GLIMS-RGI/rgi_issue_tracker/issues

# The fixes of the convert report, as the processing notes of the collection
# READMEs state them. The counts come from the build record.
fixes:
  text-encoding:
    text: >-
      Repaired text that an encoding error garbled, such as `AbbÃ© Glacier` for
      `Abbé Glacier`.
  drop-z:
    text: Dropped the Z coordinate, which is 0 in every vertex.
    issue: 43
  polygon-validity:
    text: Made the invalid outlines valid. Each repaired outline is one polygon.
    issue: 48

# The description of every thumbnail. The images live in metadata/thumbnails/
# at the path of the document they belong to. The basemap credit is the
# copyrightText of the Esri World Light Gray Base service.
thumbnail: >-
  The default style of the data, drawn by chiitiler over the Esri World Light
  Gray Base map. Basemap: Esri, HERE, Garmin, (c) OpenStreetMap contributors,
  and the GIS user community.

description: >-
  The Randolph Glacier Inventory (RGI) is a globally complete inventory of
  glacier outlines. This catalog republishes it as GeoParquet files and a web
  map archive. The values are those of the RGI release. Fixes of documented
  upstream errors are listed in the provenance record.

versions:
  "7.0":
    mirror_revision: 7.0-r1
    title: RGI 7.0
    description: >-
      RGI 7.0, released in 2023. It holds 274,531 glacier outlines with
      their attributes.
    collections:
      glaciers:
        product: G
        title: RGI 7.0 glaciers
        description: >-
          One row per glacier: the outline, RGI's attributes, the hypsometry,
          the links to RGI 6.0 and the GLIMS submission, in one GeoParquet
          file. A web map archive holds the outlines and the glacier names.
        keywords: [glacier outlines, hypsometry]
        pmtiles_layers: [glaciers, glacier-labels]
        # Processing notes besides the fix counts. Known issues quote the
        # issue titles.
        processing_notes:
          - text: >-
              `rgi6_links` comes from the corrected links file, not from the
              links in the glacier product zip.
            issue: 41
        known_issues:
          - text: ANLYS_IDs are not truly unique
            issue: 27
          - text: Missing glaciers in Greenland
            issue: 58
          - text: Missing glaciers in the Aleutian Islands
            issue: 63
        # The README's access query.
        example:
          what: one glacier
          columns: rgi_id, display_name, area_km2, zmed_m
          where: rgi_id = 'RGI2000-v7.0-G-11-01706'
      complexes:
        product: C
        title: RGI 7.0 glacier complexes
        row_noun: glacier complex
        description: >-
          One row per glacier complex: the glaciers that touch, merged into one
          outline, with RGI's attributes and the IDs of the member glaciers, in
          one GeoParquet file. The web map archive holds the outlines.
        keywords: [glacier complexes]
        pmtiles_layers: [complexes]
        known_issues:
          - text: Glacier complex product may have artifacts at glacier divides
            issue: 21
        example:
          what: the glacier complex of the Rhone glacier
          columns: rgi_id, area_km2, len(glacier_ids) AS n_glaciers
          where: rgi_id = 'RGI2000-v7.0-C-11-01208'
      centerlines:
        product: L
        title: RGI 7.0 glacier centerlines
        row_noun: centerline
        description: >-
          One row per centerline: the main centerline and the tributary
          centerlines of every glacier, with RGI's attributes, in one
          GeoParquet file. The web map archive holds the lines from z8.
        keywords: [glacier centerlines, glacier length]
        pmtiles_layers: [centerlines]
        # The centerlines page of the user guide asks for these as well.
        publications:
          - doi: 10.5194/tc-8-503-2014
            citation: >-
              Kienholz, C., Rich, J. L., Arendt, A. A., & Hock, R. (2014). A new
              method for deriving glacier centerlines applied to glaciers in
              Alaska and northwest Canada. *The Cryosphere, 8*(2), 503–519.
              https://doi.org/10.5194/tc-8-503-2014
          - doi: 10.5194/gmd-12-909-2019
            citation: >-
              Maussion, F., Butenko, A., Champollion, N., Dusch, M., Eis, J.,
              Fourteau, K., Gregor, P., Jarosch, A. H., Landmann, J., Oesterle,
              F., Recinos, B., Rothenpieler, T., Vlug, A., Wild, C. T., &
              Marzeion, B. (2019). The Open Global Glacier Model (OGGM) v1.1.
              *Geoscientific Model Development, 12*(3), 909–931.
              https://doi.org/10.5194/gmd-12-909-2019
        example:
          what: the main centerline of the Rhone glacier
          columns: rgi_id, rgi_g_id, segment_id, length_m
          where: rgi_g_id = 'RGI2000-v7.0-G-11-01706' AND is_main
      intersects:
        product: I
        title: RGI 7.0 glacier intersects
        row_noun: intersect
        description: >-
          One row per intersect: a line that divides two adjacent glaciers,
          with the IDs of both glaciers, in one GeoParquet file. The web map
          archive holds the lines from z10.
        keywords: [glacier divides]
        pmtiles_layers: [intersects]
        example:
          what: the intersects of the Rhone glacier
          columns: rgi_id, rgi_g_id_1, rgi_g_id_2, length_m
          where: "'RGI2000-v7.0-G-11-01706' IN (rgi_g_id_1, rgi_g_id_2)"
      regions:
        product: regions
        title: RGI 7.0 glacier regions
        row_noun: region polygon
        key: long_code
        description: >-
          The 20 first-order and 90 second-order glacier regions of RGI 7.0, in
          one GeoParquet file. Regions 10 and 19-15 cross the antimeridian and
          are two rows each. The web map archive holds the boundaries and the
          names.
        keywords: [glacier regions, GTN-G]
        pmtiles_layers: [regions, region-labels]
        # The regions are GTN-G's, with their own citation and terms.
        doi: 10.5904/gtng-glacreg-2023-07
        citation: >-
          World Glacier Monitoring Service. (2023). *GTN-G glacier regions
          (GlacReg)* [Data set]. Global Terrestrial Network for Glaciers.
          https://doi.org/10.5904/gtng-glacreg-2023-07
        license: other
        license_url: https://www.gtn-g.ch/glacreg/
        license_title: >-
          GTN-G Glacier Regions: "Open access for scientific and educational
          purposes under requirement of correct citation"
        example:
          what: the first-order regions
          columns: o1region, full_name, long_code
          where: level = 1
